name: 友链申请
description: 提交友链申请（请确保已在您的网站添加本站链接）
title: "友链申请: [您的网站名称]"
labels: ["friend-link"]
assignees:
  - ozm519

body:
  - type: markdown
    attributes:
      value: |
        ## 📋 申请前必读
        
        在提交申请前，**请务必先在您的网站上添加指向本站的友链**：
        
        ```html
        <a href="https://b.667891.xyz" target="_blank" rel="noopener noreferrer">粽子不解绳博客</a>
        ```
        
        我们会通过自动化工具验证回链是否存在。

  - type: input
    id: site-name
    attributes:
      label: 网站名称
      description: 您的网站名称（不超过50个字符）
      placeholder: 例如: 粽子不解绳的博客
    validations:
      required: true

  - type: input
    id: site-url
    attributes:
      label: 网站 URL
      description: 您的网站完整 URL（必须以 http:// 或 https:// 开头）
      placeholder: 例如: https://example.com/
    validations:
      required: true

  - type: input
    id: site-description
    attributes:
      label: 网站描述
      description: 简短描述您的网站（不超过100个字符）
      placeholder: 例如: 一个关于技术的个人博客
    validations:
      required: true

  - type: input
    id: site-avatar
    attributes:
      label: 网站头像 URL（可选）
      description: 您的头像图片链接，建议尺寸 100x100 像素
      placeholder: 例如: https://example.com/avatar.png

  - type: dropdown
    id: site-category
    attributes:
      label: 网站分类
      description: 选择适合的分类
      options:
        - 个人网站
        - 技术博客
        - 设计/创意
        - 其他
    validations:
      required: true

  - type: input
    id: backlink-url
    attributes:
      label: 回链地址（可选）
      description: 本站链接在您网站上的位置，方便我们快速验证
      placeholder: 例如: https://example.com/friends/

  - type: checkboxes
    id: terms
    attributes:
      label: 条款确认
      description: 请确认以下事项
      options:
        - label: ✅ 我已在我的网站上添加了指向 b.667891.xyz 的友链
          required: true
        - label: ✅ 我的网站可以正常访问
          required: true
        - label: ✅ 我的网站内容健康、积极
          required: true
        - label: ✅ 我同意本站定期对我的网站进行访问性测试
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 📝 提交后会发生什么？
        
        1. 你提交 Issue 后，需要 **Fork 本仓库并创建 PR**
        2. 自动化系统会验证你的 JSON 格式是否正确
        3. 自动化系统会访问你的网站，**检查是否存在回链**
        4. 验证通过后会自动打上 `待合并` 标签
        5. 管理员审核后会合并 PR
        
        详细教程请查看 [友链页面](/friends)
