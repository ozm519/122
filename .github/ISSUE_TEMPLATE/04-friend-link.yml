name: 友链申请
description: 提交友链申请
title: "友链申请: [您的网站名称]"
labels: ["friend-link"]
assignees:
  - ozm519

body:
  - type: input
    id: site-name
    attributes:
      label: 网站名称
      description: 您的网站名称
      placeholder: 例如: 粽子不解绳的博客
    validations:
      required: true

  - type: input
    id: site-url
    attributes:
      label: 网站 URL
      description: 您的网站完整 URL
      placeholder: 例如: https://zzbjs.de5.net/
    validations:
      required: true

  - type: input
    id: site-description
    attributes:
      label: 网站描述
      description: 您的网站简短描述
      placeholder: 例如: 粽子不解绳的个人网站
    validations:
      required: true

  - type: input
    id: site-avatar
    attributes:
      label: 网站头像
      description: 您的网站头像 URL (可选)
      placeholder: 例如: https://example.com/avatar.png

  - type: input
    id: site-category
    attributes:
      label: 网站分类
      description: 您的网站分类
      placeholder: 例如: 个人网站, 技术博客
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 条款同意
      description: 请确认您同意以下条款
      options:
        - label: 我已确认我的网站可以正常访问
          required: true
        - label: 我已在我的网站上添加了指向本博客的友链
          required: true
        - label: 我同意本博客定期对我的网站进行访问性测试
          required: true
