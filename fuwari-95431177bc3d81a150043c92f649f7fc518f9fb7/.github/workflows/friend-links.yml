name: Friend Links Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'data/friends.json'
  schedule:
    - cron: '0 4 * * *' # 每天凌晨4点运行访问性测试（UTC时间）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SITE_URL: 'https://b.667891.xyz'

jobs:
  # Job 1: 验证 JSON 格式
  validate-format:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
      error: ${{ steps.validate.outputs.error }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON format
        id: validate
        run: |
          echo "📋 Validating friends.json format..."
          
          # 检查文件是否存在
          if [ ! -f "data/friends.json" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "error=data/friends.json not found" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # 使用 Python 验证 JSON 格式
          python3 << 'EOF'
          import json
          import sys
          
          try:
              with open('data/friends.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              # 基本结构验证
              required_fields = ['version', 'siteUrl', 'categories']
              for field in required_fields:
                  if field not in data:
                      print(f"valid=false")
                      print(f"error=Missing required field: {field}")
                      sys.exit(1)
              
              # 验证 categories 结构
              if not isinstance(data['categories'], list):
                  print("valid=false")
                  print("error=categories must be an array")
                  sys.exit(1)
              
              for i, category in enumerate(data['categories']):
                  if 'name' not in category or 'links' not in category:
                      print(f"valid=false")
                      print(f"error=Category {i} missing name or links")
                      sys.exit(1)
                  
                  if not isinstance(category['links'], list):
                      print(f"valid=false")
                      print(f"error=Category {category['name']} links must be an array")
                      sys.exit(1)
                  
                  for j, link in enumerate(category['links']):
                      required_link_fields = ['name', 'url', 'description']
                      for field in required_link_fields:
                          if field not in link:
                              print(f"valid=false")
                              print(f"error=Link {j} in {category['name']} missing {field}")
                              sys.exit(1)
                      
                      # 验证 URL 格式
                      if not link['url'].startswith(('http://', 'https://')):
                          print(f"valid=false")
                          print(f"error=Invalid URL for {link['name']}: {link['url']}")
                          sys.exit(1)
              
              # 统计链接数量
              total_links = sum(len(cat['links']) for cat in data['categories'])
              print(f"✅ JSON format is valid")
              print(f"📊 Found {len(data['categories'])} categories, {total_links} links")
              print("valid=true")
              
          except json.JSONDecodeError as e:
              print(f"valid=false")
              print(f"error=Invalid JSON: {str(e)}")
              sys.exit(1)
          except Exception as e:
              print(f"valid=false")
              print(f"error={str(e)}")
              sys.exit(1)
          EOF

  # Job 2: 验证回链
  verify-backlink:
    runs-on: ubuntu-latest
    needs: validate-format
    if: github.event_name == 'pull_request' && needs.validate-format.outputs.valid == 'true'
    outputs:
      backlink_valid: ${{ steps.verify.outputs.backlink_valid }}
      backlink_results: ${{ steps.verify.outputs.backlink_results }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backlinks
        id: verify
        run: |
          echo "🔗 Verifying backlinks..."
          
          python3 << 'PYEOF'
          import json
          import urllib.request
          import urllib.error
          import ssl
          import re
          from datetime import datetime
          
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          SITE_URL = '${{ env.SITE_URL }}'.rstrip('/')
          
          def check_backlink(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'FriendLinkBot/1.0 (https://b.667891.xyz)',
                          'Accept': 'text/html,application/xhtml+xml',
                          'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'
                  })
                  
                  with urllib.request.urlopen(req, timeout=15, context=ctx) as response:
                      html = response.read().decode('utf-8', errors='ignore')
                      
                      patterns = [
                          re.escape(SITE_URL),
                          re.escape(SITE_URL.replace('https://', '')),
                          re.escape(SITE_URL.replace('https://www.', '')),
                          'b\\.667891\\.xyz',
                          '667891\\.xyz'
                      ]
                      
                      for pattern in patterns:
                          if re.search(pattern, html, re.IGNORECASE):
                              return True, 'Found'
                      
                      return False, 'Not found'
                      
              except urllib.error.HTTPError as e:
                  return False, f'HTTP {e.code}'
              except urllib.error.URLError as e:
                  return False, f'URL Error: {str(e.reason)}'
              except Exception as e:
                  return False, f'Error: {str(e)}'
          
          with open('data/friends.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          
          results = []
          all_valid = True
          
          for category in data['categories']:
              for link in category['links']:
                  url = link['url']
                  name = link['name']
                  
                  print(f"\n🔍 Checking: {name} ({url})")
                  found, status = check_backlink(url)
                  
                  result = {
                      'name': name,
                      'url': url,
                      'backlink_found': found,
                      'status': status
                  }
                  results.append(result)
                  
                  if found:
                      print(f"  ✅ Backlink found!")
                  else:
                      print(f"  ❌ Backlink NOT found ({status})")
                      all_valid = False
          
          print(f"\nbacklink_valid={'true' if all_valid else 'false'}" >> "$GITHUB_OUTPUT")
          print(f"backlink_results={json.dumps(results)}" >> "$GITHUB_OUTPUT")
          
          total = len(results)
          passed = sum(1 for r in results if r['backlink_found'])
          print(f"\n📊 Results: {passed}/{total} links have backlinks")
          PYEOF

  # Job 3: 更新 PR 标签和状态
  update-pr-status:
    runs-on: ubuntu-latest
    needs: [validate-format, verify-backlink]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PR labels and status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            
            const existingLabels = pr.labels.map(l => l.name);
            const newLabels = [];
            
            const statusLabels = ['待审核', '格式错误', '回链缺失', '待合并', '验证通过'];
            const filteredLabels = existingLabels.filter(l => !statusLabels.includes(l));
            
            const formatValid = '${{ needs.validate-format.outputs.valid }}' === 'true';
            const backlinkValid = '${{ needs.verify-backlink.outputs.backlink_valid }}' === 'true';
            
            if (!formatValid) {
              newLabels.push('格式错误');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `## ❌ 格式验证失败\n\n${{ needs.validate-format.outputs.error }}\n\n请检查 \`data/friends.json\` 文件的格式是否符合要求。`
              });
            } else if (!backlinkValid) {
              newLabels.push('回链缺失');
              const results = JSON.parse('${{ needs.verify-backlink.outputs.backlink_results }}');
              const missingLinks = results.filter(r => !r.backlink_found);
              
              let comment = `## ⚠️ 回链验证失败\n\n以下网站未找到指向本站的友链：\n\n`;
              missingLinks.forEach(link => {
                comment += `- **${link.name}** (${link.url}) - ${link.status}\n`;
              });
              comment += `\n请在您的网站上添加指向 \`${{ env.SITE_URL }}\` 的链接后重新提交。`;
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: comment
              });
            } else {
              newLabels.push('待合并');
              newLabels.push('验证通过');
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `## ✅ 验证通过\n\n- ✅ JSON 格式正确\n- ✅ 所有回链验证通过\n\n等待管理员审核合并...`
              });
            }
            
            if (newLabels.length === 0) {
              newLabels.push('待审核');
            }
            
            const finalLabels = [...filteredLabels, ...newLabels];
            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: finalLabels
            });
            
            console.log(`Updated PR #${prNumber} labels:`, finalLabels);

  # Job 4: 自动合并（需要手动触发）
  auto-merge:
    runs-on: ubuntu-latest
    needs: [validate-format, verify-backlink]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-format.outputs.valid == 'true' &&
      needs.verify-backlink.outputs.backlink_valid == 'true'
    steps:
      - name: Auto-merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const hasAutoMergeLabel = pr.labels.some(
              label => label.name === '自动合并'
            );
            
            if (hasAutoMergeLabel) {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: `feat: add friend links (auto-merged #${prNumber})`
                });
                
                console.log(`✅ Auto-merged PR #${prNumber}`);
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '## 🎉 自动合并成功\n\n友链已自动添加到列表中，感谢你的申请！'
                });
              } catch (error) {
                console.log(`❌ Failed to auto-merge: ${error.message}`);
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `## ❌ 自动合并失败\n\n${error.message}\n\n请手动合并此 PR。`
                });
              }
            } else {
              console.log('ℹ️ PR does not have "自动合并" label, skipping auto-merge');
              console.log('Add the "自动合并" label to enable auto-merge for this PR');
            }

  # Job 5: 定期访问性测试
  accessibility-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run accessibility tests
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import urllib.error
          import ssl
          from datetime import datetime
          
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          def test_url(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'FriendLinkBot/1.0'}
                  )
                  with urllib.request.urlopen(req, timeout=10, context=ctx) as response:
                      return response.status < 400
              except:
                  return False
          
          with open('data/friends.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          
          print("🔍 Running accessibility tests...\n")
          
          failed_links = []
          
          for category in data['categories']:
              for link in category['links']:
                  url = link['url']
                  name = link['name']
                  
                  accessible = test_url(url)
                  status = "✅" if accessible else "❌"
                  print(f"{status} {name}: {url}")
                  
                  if not accessible:
                      failed_links.append({
                          'name': name,
                          'url': url,
                          'category': category['name']
                      })
          
          print(f"\n📊 Test completed")
          print(f"Failed: {len(failed_links)} links")
          
          if failed_links:
              print("\n⚠️ Failed links:")
              for link in failed_links:
                  print(f"- {link['name']} ({link['url']})")
          EOF

      - name: Create issue for failed links (if any)
        if: failure()
        run: |
          echo "Some links are inaccessible. Consider creating an issue to review them."
